[package]
name = "remote-input-helper"
version = "0.1.0"
edition = "2021"
description = "Mochi OA 远程控制虚拟键鼠常驻助手（Windows SendInput / Linux uinput / macOS CGEvent）"
publish = false

[[bin]]
name = "remote-input-helper"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(linux)'.dependencies]
libc = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(windows)', 'cfg(linux)', 'cfg(darwin)'] }

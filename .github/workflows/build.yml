# 麻薯OA 客户端 GitHub Actions 构建工作流
# 触发方式：
#   - push 到 main        → 全平台构建并上传构建产物（artifact）
#   - push v* tag         → 全平台构建 + 自动创建 GitHub Release 并附带安装包
#   - workflow_dispatch   → 手动触发
#
# 平台产物（electron-builder，输出到 release/）：
#   Windows → NSIS 安装包 (.exe)
#   macOS   → DMG
#   Linux   → AppImage

name: Build Client

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# CI 无代码签名证书：跳过 electron-builder 自动签名（Windows 打未签名包，mac 不因签名失败）
env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact_name: mochi-oa-win
          # - os: macos-latest
          #   script: dist:mac
          #   artifact_name: mochi-oa-mac
          - os: ubuntu-latest
            script: dist:linux
            artifact_name: mochi-oa-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build & package (${{ matrix.os }})
        run: npm run ${{ matrix.script }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    # push v* tag 或手动触发（手动时从 package.json 自动取版本号打 tag）
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tag / release 名统一取 package.json 的 version（如 0.9.4 → v0.9.4）
      - name: Resolve version & tag
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # 仅手动触发时：若该 tag 不存在则从当前提交创建
      - name: Create tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists, reuse it"
          else
            gh api --method POST "repos/${{ github.repository }}/git/refs" \
              -f "ref=refs/tags/$TAG" \
              -f "sha=${{ github.sha }}"
            echo "created tag $TAG"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Create Release & attach installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: dist-artifacts/**
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
